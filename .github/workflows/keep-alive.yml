name: Keep Alive Render

on:
  schedule:
    - cron: '*/10 * * * *'  # Ping mỗi 10 phút
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API Health
        run: |
          curl -fsS "${{ secrets.RENDER_API_URL }}/health" || true
          echo "Pinged at $(date)"

      - name: Ping Render API Root
        run: |
          curl -fsS "${{ secrets.RENDER_API_URL }}/" || true
          echo "Root pinged at $(date)"